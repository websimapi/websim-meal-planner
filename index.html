<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "uuid": "https://cdn.jsdelivr.net/npm/uuid@8.3.2/dist/esm-browser/v4.js"
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Meal Planner</h1>
        </header>

        <nav class="tabs">
            <button class="tab-button active" data-tab="menu">Menu</button>
            <button class="tab-button" data-tab="favorites">Favorites</button>
            <button class="tab-button" data-tab="shopping-list">Shopping List</button>
        </nav>

        <main class="tab-content">
            <section id="menu" class="tab-pane active">
                <h2>Two Week Menu</h2>
                <div id="menu-grid" class="menu-grid">
                    <!-- Menu days will be populated here by JS -->
                </div>
            </section>

            <section id="favorites" class="tab-pane">
                <h2>Favorite Recipes</h2>
                <button id="add-recipe-btn" class="button">Add New Recipe</button>

                <div id="recipe-form" class="recipe-form hidden">
                    <h3>Add/Edit Recipe</h3>
                    <input type="hidden" id="recipe-id">
                    <div class="form-group">
                        <label for="recipe-title">Title:</label>
                        <input type="text" id="recipe-title" required>
                    </div>
                     <div class="form-group">
                        <label for="recipe-web-paste">Paste from Web (optional):</label>
                        <textarea id="recipe-web-paste" rows="3" placeholder="Paste ingredients/steps from a recipe website here. You will still need to structure the data below."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="recipe-ingredients">Ingredients (one per line):</label>
                        <textarea id="recipe-ingredients" rows="6" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="recipe-preparation">Preparation Steps:</label>
                        <textarea id="recipe-preparation" rows="6" required></textarea>
                    </div>
                     <div class="form-group checkbox-group">
                        <input type="checkbox" id="recipe-default">
                        <label for="recipe-default">Mark as Default (always include in shopping list)</label>
                    </div>
                    <div class="form-actions">
                        <button id="save-recipe-btn" class="button primary">Save Recipe</button>
                        <button id="cancel-recipe-btn" class="button">Cancel</button>
                    </div>
                </div>

                <div id="favorites-list">
                    <!-- Favorite recipes will be populated here by JS -->
                </div>
            </section>

            <section id="shopping-list" class="tab-pane">
                <h2>Shopping List</h2>
                <button id="generate-shopping-list-btn" class="button primary">Generate List</button>
                <div id="shopping-list-output">
                    <!-- Shopping list will be generated here by JS -->
                    <p>Click "Generate List" to see the ingredients needed for your planned menu and default recipes.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for selecting recipe to add to menu -->
    <div id="select-recipe-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Select a Recipe</h3>
            <div id="modal-recipe-list">
                <!-- Recipes populated here by JS -->
            </div>
            <button class="button" id="cancel-select-recipe">Cancel</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
